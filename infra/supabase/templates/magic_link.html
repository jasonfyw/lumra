<!doctype html>
<html lang="en">
  <body style="font-family: system-ui, sans-serif; color: #111111">
    <h2>Sign in to Lumra</h2>
    <p>Your sign-in code is:</p>
    <p style="font-size: 28px; letter-spacing: 6px; font-weight: 600">{{ .Token }}</p>
    <p>
      Or
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
        >sign in with this link</a
      >. The code and link expire in 15 minutes and work once.
    </p>
    <p style="color: #5c5c58">If you didn’t ask to sign in, you can ignore this email.</p>
  </body>
</html>
